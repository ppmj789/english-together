<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7f2">
<title>영어 같이 하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7f2; --card:#ffffff; --ink:#3b3330; --dim:#9a8f8a; --line:#f0e4dc;
  --accent:#ff8fa3; --accent-soft:#ffe3e8; --ok:#5cbf8a; --shadow:0 2px 10px rgba(120,80,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  word-break:keep-all;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none!important}

/* 로그인 */
.login{min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.login h1{font-size:26px;margin:0}
.login p{color:var(--dim);margin:0;line-height:1.6}
.who{display:flex;flex-direction:column;gap:12px}
.who button{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);
  border-radius:18px;box-shadow:var(--shadow);text-align:left;font-size:19px;font-weight:700}
.who button:active{transform:scale(.98)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:700;flex:none}
.btn{display:inline-block;padding:14px 18px;border-radius:14px;background:var(--accent);color:#fff;
  font-size:17px;font-weight:700;box-shadow:var(--shadow)}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.err{color:#d9534f;font-size:14px;min-height:20px}

/* 헤더 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:20px;margin:0}
.me{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.streak{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;margin-bottom:14px}
.streak b{font-size:22px}
.streak small{color:var(--dim)}

/* 달력 */
.cal{background:var(--card);border-radius:22px;padding:14px 12px 10px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.cal-head b{font-size:18px}
.cal-head button{width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--dim)}
.cal-head button:hover{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--dim);padding-bottom:4px}
.wd:first-child{color:#e57373}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border-radius:14px}
.day.sel{background:var(--accent-soft)}
.day.out{visibility:hidden}
.day.future{opacity:.35}
.bead{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:var(--bg);position:relative;transition:transform .2s}
.day.today .bead{box-shadow:0 0 0 2px var(--ink) inset}
.bead.full{color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.bead.full::after{content:'✨';position:absolute;top:-8px;right:-8px;font-size:12px}
.pips{display:flex;gap:3px;height:6px}
.pip{width:6px;height:6px;border-radius:50%;background:var(--line)}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim);padding-top:10px}
.legend span{display:flex;align-items:center;gap:5px}

/* 그날 */
.sec{margin-top:16px;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.sec h2{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sec h2 small{color:var(--dim);font-weight:400;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .name{flex:1;display:flex;align-items:center;gap:8px;font-size:16px}
.row .name em{font-style:normal;color:var(--dim);font-size:12px}
.chip{padding:8px 12px;border-radius:999px;font-size:14px;background:var(--bg);color:var(--dim);
  border:2px solid transparent;white-space:nowrap}
.chip.on{color:#fff}
.chip.mine{border-color:var(--line)}
.chip:disabled{cursor:default}
.allclear{text-align:center;padding:10px;border-radius:14px;margin-top:8px;font-size:15px}

/* 영상 */
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%}
.vtitle{margin:10px 0 2px;font-size:15px}
.vmeta{font-size:13px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.vmeta button{color:var(--dim);text-decoration:underline;font-size:13px}
.vform{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--dim);line-height:1.5}

/* 축하 */
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.burst i{position:absolute;top:-20px;font-style:normal;font-size:22px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.foot{text-align:center;margin-top:20px}
.foot button{color:var(--dim);font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">

  <!-- 캐릭터 고르기 -->
  <section id="v-login" class="login hidden">
    <h1>영어 같이 하기</h1>
    <p>스픽 하고, 자막 없이 영상 하나.<br>누구로 들어갈까요?</p>
    <div class="who" id="who"></div>
    <div class="err" id="login-err"></div>
  </section>

  <!-- 메인 -->
  <section id="v-main" class="hidden">
    <div class="top">
      <h1>영어 같이 하기</h1>
      <div class="me" id="me"></div>
    </div>

    <div class="streak" id="streak"></div>

    <div class="cal">
      <div class="cal-head">
        <button id="prev" aria-label="이전 달">‹</button>
        <b id="month"></b>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="sec" id="day-sec"></div>
    <div class="sec" id="video-sec"></div>

    <div class="foot"><button id="logout">다른 사람으로 들어가기</button></div>
  </section>
</div>
<div class="burst" id="burst"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ── 백엔드 연결 (미지의 서재와 같은 Supabase, eng_* 테이블) ──
   두 줄을 비우면 이 브라우저 localStorage 로만 동작(혼자 테스트용). */
var SB_URL = 'https://kkkmsnyiwliovitsmsmw.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtra21zbnlpd2xpb3ZpdHNtc213Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTgzNDEsImV4cCI6MjA5NDczNDM0MX0.lNYzLXqyI2cVsxm2yhKgvnIIZpqeIV4TEw-S0gAVb5I';   /* anon public */
var sb = null;
try{ if(SB_URL && SB_KEY && window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){ sb = null; }

/* 우리 셋. id 는 DB eng_member.phone4 칸에 들어가는 고정값(4자리 형식 유지) */
var PEOPLE = [
  {phone4:'0001', name:'Simon', color:'#6c9ef0'},
  {phone4:'0002', name:'MiMi',  color:'#ff8fa3'},
  {phone4:'0003', name:'Jamie', color:'#f5b94a'}
];
var WD = ['일','월','화','수','목','금','토'];

/* ── 저장소: Supabase 또는 localStorage ── */
var DB = {
  _ls: function(k, v){
    try{
      if(v === undefined) return JSON.parse(localStorage.getItem('eng:'+k) || 'null');
      localStorage.setItem('eng:'+k, JSON.stringify(v));
    }catch(e){ return null; }
  },
  ensureMember: async function(m){
    if(!sb) return;
    var r = await sb.from('eng_member').upsert(m, {onConflict:'phone4', ignoreDuplicates:true});
    if(r.error) throw r.error;
  },
  checks: async function(from, to){
    if(!sb) return (DB._ls('checks') || []).filter(function(c){ return c.day >= from && c.day <= to; });
    var r = await sb.from('eng_check').select('day,phone4,speak,video').gte('day', from).lte('day', to);
    if(r.error) throw r.error; return r.data;
  },
  saveCheck: async function(c){
    if(!sb){
      var a = (DB._ls('checks') || []).filter(function(x){ return !(x.day === c.day && x.phone4 === c.phone4); });
      a.push(c); DB._ls('checks', a); return;
    }
    var r = await sb.from('eng_check').upsert(Object.assign({updated_at: new Date().toISOString()}, c), {onConflict:'day,phone4'});
    if(r.error) throw r.error;
  },
  videos: async function(from, to){
    if(!sb) return (DB._ls('videos') || []).filter(function(v){ return v.day >= from && v.day <= to; });
    var r = await sb.from('eng_video').select('day,url,title,by_phone4').gte('day', from).lte('day', to);
    if(r.error) throw r.error; return r.data;
  },
  saveVideo: async function(v){
    if(!sb){
      var a = (DB._ls('videos') || []).filter(function(x){ return x.day !== v.day; });
      a.push(v); DB._ls('videos', a); return;
    }
    var r = await sb.from('eng_video').upsert(Object.assign({updated_at: new Date().toISOString()}, v), {onConflict:'day'});
    if(r.error) throw r.error;
  }
};

/* ── 상태 ── */
var S = { me:null, members:PEOPLE, checks:{}, videos:{}, view:null, sel:null };

/* ── 날짜 (기기 현지 시각 기준) ── */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function today(){ return ymd(new Date()); }
function label(s){ var d = parse(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function show(id){ ['v-login','v-main'].forEach(function(v){ $(v).classList.toggle('hidden', v !== id); }); }
var _tt; function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(function(){ e.classList.remove('show'); }, 1800); }

/* ── 완료 판정 ── */
function chk(day, p){ return (S.checks[day] && S.checks[day][p]) || {speak:false, video:false}; }
function personDone(day, p){ var c = chk(day, p); return c.speak && c.video; }
function allDone(day){
  if(!S.members.length) return false;
  return S.members.every(function(m){ return personDone(day, m.phone4); });
}
function streak(){
  var d = today(), n = 0;
  if(!allDone(d)) d = addDays(d, -1);        // 오늘은 아직 진행 중일 수 있음
  while(allDone(d)){ n++; d = addDays(d, -1); }
  return n;
}
function beadBg(){
  var cs = S.members.map(function(m){ return m.color; });
  if(cs.length === 1) return cs[0];
  return 'linear-gradient(135deg,'+cs.join(',')+')';
}

/* ── 데이터 로드 ── */
async function loadAll(){
  var from = addDays(ymd(new Date(S.view.y, S.view.m, 1)), -7);
  var t = today(), back = addDays(t, -200);
  if(back < from) from = back;
  var to = addDays(ymd(new Date(S.view.y, S.view.m+1, 0)), 7);
  if(to < t) to = t;
  var res = await Promise.all([DB.checks(from, to), DB.videos(from, to)]);
  S.checks = {};
  res[0].forEach(function(c){ (S.checks[c.day] = S.checks[c.day] || {})[c.phone4] = {speak:!!c.speak, video:!!c.video}; });
  S.videos = {};
  res[1].forEach(function(v){ S.videos[v.day] = v; });
}

/* ── 캐릭터 고르기 ── */
function renderWho(){
  $('who').innerHTML = PEOPLE.map(function(m){
    return '<button data-who="'+m.phone4+'"><span class="av" style="background:'+m.color+'">'+esc(m.name[0])+'</span>'+esc(m.name)+'</button>';
  }).join('');
}
async function pick(id){
  var m = PEOPLE.find(function(x){ return x.phone4 === id; });
  $('login-err').textContent = '';
  try{ await DB.ensureMember(m); }
  catch(e){ $('login-err').textContent = '연결이 안 돼요. 잠시 뒤 다시 눌러 주세요.'; return; }
  enter(m);
}
async function enter(m){
  S.me = m;
  try{ localStorage.setItem('eng:me', m.phone4); }catch(e){}
  var n = new Date(); S.view = {y:n.getFullYear(), m:n.getMonth()}; S.sel = today();
  show('v-main');
  await refresh();
}
function logout(){
  try{ localStorage.removeItem('eng:me'); }catch(e){}
  S.me = null; renderWho(); show('v-login');
}

/* ── 렌더 ── */
async function refresh(){
  try{ await loadAll(); }catch(e){ toast('불러오기 실패 — 새로고침 해 주세요'); }
  render();
}
function render(){
  $('me').innerHTML = '<span class="dot" style="background:'+esc(S.me.color)+'"></span>'+esc(S.me.name);
  renderStreak(); renderCal(); renderDay(); renderVideo();
}
function renderStreak(){
  var n = streak();
  $('streak').innerHTML = n
    ? '<span style="font-size:30px">🔥</span><div><b>'+n+'일 연속</b><br><small>셋 다 해낸 날이 이어지고 있어요</small></div>'
    : '<span style="font-size:30px">🌱</span><div><b>오늘부터 시작</b><br><small>모두 스픽 + 영상까지 하면 달력이 칠해져요</small></div>';
}
function renderCal(){
  var y = S.view.y, m = S.view.m, t = today();
  $('month').textContent = y+'년 '+(m+1)+'월';
  var first = new Date(y, m, 1).getDay(), last = new Date(y, m+1, 0).getDate();
  var h = WD.map(function(w){ return '<div class="wd">'+w+'</div>'; }).join('');
  for(var i = 0; i < first; i++) h += '<div class="day out"></div>';
  for(var d = 1; d <= last; d++){
    var s = ymd(new Date(y, m, d)), full = allDone(s);
    var cls = 'day' + (s === t ? ' today' : '') + (s === S.sel ? ' sel' : '') + (s > t ? ' future' : '');
    var pips = S.members.map(function(mm){
      var c = chk(s, mm.phone4), k = (c.speak ? 1 : 0) + (c.video ? 1 : 0);
      return '<span class="pip" style="'+(k ? 'background:'+esc(mm.color)+';opacity:'+(k === 2 ? 1 : .4) : '')+'"></span>';
    }).join('');
    h += '<button class="'+cls+'" data-d="'+s+'"'+(s > t ? ' disabled' : '')+'>'
      + '<span class="bead'+(full ? ' full' : '')+'"'+(full ? ' style="background:'+beadBg()+'"' : '')+'>'+d+'</span>'
      + '<span class="pips">'+pips+'</span></button>';
  }
  $('grid').innerHTML = h;
  $('legend').innerHTML = S.members.map(function(mm){
    return '<span><span class="dot" style="background:'+esc(mm.color)+'"></span>'+esc(mm.name)+'</span>';
  }).join('');
  var now = new Date();
  $('next').style.visibility = (y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth())) ? 'hidden' : '';
}
function renderDay(){
  var s = S.sel, isToday = s === today();
  var rows = S.members.map(function(mm){
    var c = chk(s, mm.phone4), mine = mm.phone4 === S.me.phone4;
    function chip(key, txt){
      var on = c[key];
      return '<button class="chip'+(on ? ' on' : '')+(mine ? ' mine' : '')+'"'
        +(on ? ' style="background:'+esc(mm.color)+'"' : '')
        +(mine ? ' data-t="'+key+'"' : ' disabled')+'>'+(on ? '✓ ' : '')+txt+'</button>';
    }
    return '<div class="row"><div class="name"><span class="dot" style="background:'+esc(mm.color)+'"></span>'
      + esc(mm.name)+(mine ? ' <em>나</em>' : '')+(personDone(s, mm.phone4) ? ' 🌸' : '')+'</div>'
      + chip('speak', '스픽')+chip('video', '영상')+'</div>';
  }).join('');
  var done = allDone(s), cnt = S.members.filter(function(mm){ return personDone(s, mm.phone4); }).length;
  $('day-sec').innerHTML = '<h2>'+(isToday ? '오늘 · ' : '')+label(s)+'<small>'+cnt+' / '+S.members.length+'명 완료</small></h2>'
    + rows
    + (done ? '<div class="allclear" style="background:'+beadBg()+';color:#fff">🎉 다 같이 해냈어요!</div>' : '');
}

/* ── 영상 (유튜브, 자막 꺼서 시작) ── */
function ytId(u){
  var m = String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
var YTP = null, _ytWait = [];
window.onYouTubeIframeAPIReady = function(){ var w = _ytWait; _ytWait = null; w.forEach(function(f){ f(); }); };
function withYT(f){
  if(window.YT && window.YT.Player) return f();
  if(_ytWait === null) _ytWait = [];
  _ytWait.push(f);
  if(!document.getElementById('yt-api')){
    var s = document.createElement('script'); s.id = 'yt-api'; s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
}
function captionsOff(p){ try{ p.unloadModule('captions'); p.unloadModule('cc'); }catch(e){} }
function renderVideo(){
  var s = S.sel, v = S.videos[s], el = $('video-sec');
  var key = s+'|'+(v ? v.url+'|'+v.title : '')+'|'+(S.editVideo ? 1 : 0);
  if(key === S.vkey && el.innerHTML) return;   // 같은 영상이면 플레이어 유지(보는 중 끊기지 않게)
  S.vkey = key;
  if(YTP){ try{ YTP.destroy(); }catch(e){} YTP = null; }
  var head = '<h2>📺 '+(s === today() ? '오늘의 영상' : label(s)+' 영상')+'<small>자막 없이 보기</small></h2>';
  if(v && !S.editVideo){
    var who = S.members.find(function(x){ return x.phone4 === v.by_phone4; });
    var id = ytId(v.url);
    el.innerHTML = head
      + (id ? '<div class="player"><div id="ytp"></div></div>'
            : '<a class="btn ghost" style="display:block;text-align:center" href="'+esc(v.url)+'" target="_blank" rel="noopener">영상 열기 ↗</a>')
      + (v.title ? '<div class="vtitle">'+esc(v.title)+'</div>' : '')
      + '<div class="vmeta"><span>'+(who ? esc(who.name)+'님이 골랐어요' : '')+'</span><button id="v-change">다른 영상으로</button></div>';
    if(id) withYT(function(){
      if(S.sel !== s || !document.getElementById('ytp')) return;
      YTP = new YT.Player('ytp', {
        videoId:id,
        playerVars:{cc_load_policy:0, rel:0, playsinline:1, modestbranding:1, hl:'en'},
        events:{
          onReady:function(e){ captionsOff(e.target); },
          onStateChange:function(e){ if(e.data === 1) captionsOff(e.target); }
        }
      });
    });
    return;
  }
  el.innerHTML = head
    + '<div class="vform">'
    + '<input class="field" id="v-url" placeholder="유튜브 링크 붙여넣기" value="'+esc(v ? v.url : '')+'">'
    + '<input class="field" id="v-title" maxlength="200" placeholder="제목 (선택)" value="'+esc(v ? v.title : '')+'">'
    + '<button class="btn" id="v-save">이 영상으로 정하기</button>'
    + (v ? '<button class="btn ghost" id="v-cancel">취소</button>' : '')
    + '<div class="hint">5분 안팎 영상 하나를 골라 셋이 같이 봐요. 자막은 꺼진 채로 시작해요.</div>'
    + '</div>';
}
async function saveVideo(){
  var url = $('v-url').value.trim(), title = $('v-title').value.trim();
  if(!url){ toast('링크를 붙여넣어 주세요'); return; }
  if(!/^https?:\/\//.test(url)) url = 'https://' + url;
  var v = {day:S.sel, url:url, title:title, by_phone4:S.me.phone4};
  try{ await DB.saveVideo(v); S.videos[S.sel] = v; S.editVideo = false; renderVideo(); toast('영상을 정했어요'); }
  catch(e){ toast('저장이 안 됐어요'); }
}

/* ── 체크 ── */
async function toggle(key){
  var s = S.sel, p = S.me.phone4;
  var before = allDone(s);
  var c = Object.assign({}, chk(s, p)); c[key] = !c[key];
  (S.checks[s] = S.checks[s] || {})[p] = c;
  renderStreak(); renderCal(); renderDay();
  try{ await DB.saveCheck({day:s, phone4:p, speak:c.speak, video:c.video}); }
  catch(e){
    c[key] = !c[key]; S.checks[s][p] = c; renderStreak(); renderCal(); renderDay(); toast('저장이 안 됐어요. 다시 눌러 주세요'); return;
  }
  if(!before && allDone(s)) celebrate();
  else if(personDone(s, p) && c[key]) toast('오늘 내 몫 끝! 🌸');
}
function celebrate(){
  var b = $('burst'), em = ['🎉','✨','🌸','💛','⭐'], h = '';
  for(var i = 0; i < 28; i++){
    h += '<i style="left:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*.6)+'s">'+em[i % em.length]+'</i>';
  }
  b.innerHTML = h; setTimeout(function(){ b.innerHTML = ''; }, 3200);
  toast('셋 다 해냈어요! 🎉');
}

/* ── 이벤트 ── */
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t || t.disabled) return;
  if(t.dataset.d){ S.sel = t.dataset.d; S.editVideo = false; renderCal(); renderDay(); renderVideo(); return; }
  if(t.dataset.t){ toggle(t.dataset.t); return; }
  if(t.dataset.who){ pick(t.dataset.who); return; }
  switch(t.id){
    case 'prev': S.view.m--; if(S.view.m < 0){ S.view.m = 11; S.view.y--; } refresh(); break;
    case 'next': S.view.m++; if(S.view.m > 11){ S.view.m = 0; S.view.y++; } refresh(); break;
    case 'v-save': saveVideo(); break;
    case 'v-change': S.editVideo = true; renderVideo(); break;
    case 'v-cancel': S.editVideo = false; renderVideo(); break;
    case 'logout': logout(); break;
  }
});
document.addEventListener('visibilitychange', function(){ if(!document.hidden && S.me) refresh(); });

/* ── 시작 ── */
(function init(){
  var saved = null; try{ saved = localStorage.getItem('eng:me'); }catch(e){}
  var m = PEOPLE.find(function(x){ return x.phone4 === saved; });
  if(m){ enter(m); return; }
  renderWho(); show('v-login');
})();
</script>
