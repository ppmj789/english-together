<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>미지의 영어</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="미지의 영어">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f4f2; --card:#ffffff; --ink:#1d1d1f; --sub:#6e6e73; --dim:#a1a1a6; --line:#ececec; --soft:#f7f7f5;
  --accent:#f5a35d; --accent2:#f9bd85; --accent-deep:#f28c3c; --accent-soft:#fff3e8;
  --ok:#7fa87a; --dark:#232323;
  --r:22px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
img{display:block}
.hidden{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:20px 16px 48px}

/* 로고 */
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.logo svg{flex:none}
.logo .w{font-size:17px}
.logo .w em{font-style:normal;color:var(--accent-deep)}
.logo.lg{gap:12px}
.logo.lg .w{font-size:30px}

/* 공통 카드 */
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}
.card-h h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em}
.link{font-size:13px;color:var(--sub)}
.link:hover{color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:46px;border-radius:999px;
  background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-weight:600;font-size:15px;
  box-shadow:0 6px 16px rgba(245,163,93,.28);text-decoration:none}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.field{width:100%;height:46px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--soft);
  font-size:15px;outline:none}
.field:focus{border-color:var(--accent);background:#fff}

/* 캐릭터 고르기 */
.pick{min-height:88vh;max-width:420px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:30px}
.pick p{margin:12px 0 0;color:var(--sub);font-size:15px;line-height:1.55}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.who button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 8px 16px;background:var(--card);
  border-radius:22px;box-shadow:var(--shadow);transition:transform .15s}
.who button:hover{transform:translateY(-2px)}
.who button:active{transform:scale(.97)}
.who .pic{width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.who .pic img{width:58px;height:58px}
.who b{font-size:16px}
.err{color:#d9534f;font-size:14px;min-height:20px}

/* 아바타(3D 이모지) */
.av{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.av img{width:24px;height:24px}

/* 대시보드 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);background:var(--card);
  padding:4px 12px 4px 4px;border-radius:999px;box-shadow:var(--shadow)}
.me .av{width:28px;height:28px;border-radius:50%}
.me .av img{width:20px;height:20px}

.dash{display:grid;gap:16px;grid-template-columns:1fr;grid-template-areas:"hello" "cal" "todo" "crew" "video"}
@media (min-width:900px){
  .dash{grid-template-columns:320px 1fr 1fr;
    grid-template-areas:"hello video todo" "cal video crew" ". video .";align-items:start}
}
.a-hello{grid-area:hello} .a-cal{grid-area:cal} .a-todo{grid-area:todo}
.a-crew{grid-area:crew} .a-video{grid-area:video}

.hello h1{font-size:32px;line-height:1.12;font-weight:800;letter-spacing:-.035em;margin:0}
.hello h1 img{display:inline-block;width:34px;height:34px;vertical-align:-5px;margin-left:2px}
.hello .date{color:var(--sub);font-size:14px;margin:10px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayn{display:inline-block;background:var(--dark);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:0}

/* 달력 — 투두메이트식 타일 */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-h b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.nav{display:flex;gap:6px}
.nav button{width:28px;height:28px;border-radius:50%;color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.nav button:disabled{visibility:hidden}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 2px;justify-items:center}
.wd{font-size:11px;color:var(--dim);padding-bottom:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;width:40px}
.tile{width:30px;height:30px;border-radius:10px;background:#e9e9e7;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:800;transition:background .2s}
.tile svg{width:16px;height:16px}
.tile.full{box-shadow:0 3px 8px rgba(0,0,0,.08)}
.day .n{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;line-height:1;padding:2px 5px;border-radius:999px}
.day.today .n{background:var(--ink);color:#fff;font-weight:700}
.day.sel .tile{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.day.off{cursor:default}
.day.off .tile{background:#f3f3f1}
.day.off .n{color:#cfcfcf}
.day.out{visibility:hidden}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.cal-foot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.cal-foot b{color:var(--ink)}
.legend{display:flex;gap:10px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:50%;display:block}

/* 할 일 */
.todos{display:flex;flex-direction:column;gap:8px}
.todo{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);
  border:1px solid var(--line);text-align:left;width:100%}
.todo .ic{width:46px;height:46px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.todo .ic img{width:30px;height:30px}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:15px;font-weight:600}
.todo .tx small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.todo.done .tx b{text-decoration:line-through;color:var(--sub)}
.todo:disabled{cursor:default}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid #d9d9d9;flex:none;display:flex;align-items:center;justify-content:center}
.box svg{width:14px;height:14px;opacity:0}
.done .box{background:var(--ok);border-color:var(--ok)}
.done .box svg{opacity:1}
.note{font-size:13px;color:var(--sub);background:var(--soft);border-radius:14px;padding:14px;text-align:center}

/* 크루 */
.crew-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.crew-row:first-of-type{border-top:0;padding-top:0}
.crew-row .nm{flex:1;font-size:15px;font-weight:600}
.crew-row .nm small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:2px}
.mini{display:flex;gap:6px}
.mini span{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--dim)}
.mini span.on{background:var(--accent-soft);color:#c46f25;font-weight:600}
.allclear{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:#c46f25;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px}
.allclear img{width:24px;height:24px}
.mini span.pass{background:#eef0ff;color:#5b63c9;font-weight:600}

/* 리액션·콕 */
.cheer{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:#eef4ff;color:#3d6fc4;flex:none;white-space:nowrap}
.cheer:disabled{background:var(--soft);color:var(--dim);font-weight:500}
.reacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rx{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:14px;line-height:1}
.rx small{font-size:11px;color:var(--sub);font-weight:600}
.rx.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent2)}
span.rx{cursor:default}
.got{display:inline-block;margin-left:6px;font-size:11px;color:var(--sub);font-weight:500}
.inbox{margin-top:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.inbox div{font-size:14px;display:flex;align-items:center;gap:8px}
.inbox div img{width:20px;height:20px}
.inbox button{align-self:flex-end;font-size:12px;color:var(--sub);margin-top:2px}

/* 패스권 */
.passpill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;border-radius:999px;
  background:#eef0ff;color:#5b63c9;font-size:12px;font-weight:600;white-space:nowrap}
.passpill:disabled{background:var(--soft);color:var(--dim);font-weight:500}
.hbtns{display:flex;align-items:center;gap:8px;flex:none}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--dim);margin:16px 2px 8px}
.sec:first-of-type{margin-top:0}
.sec b{color:var(--ok)}
.todo .ic.th{overflow:hidden;background:#111}
.todo .ic.th img{width:100%;height:100%;object-fit:cover}
.passon{font-size:14px;color:#5b63c9;background:#eef0ff;border-radius:14px;padding:14px;text-align:center;margin-bottom:10px;font-weight:600}
.passon small{display:block;font-weight:400;color:#7d83c9;margin-top:4px;font-size:12px}
.todos.dim{opacity:.4;pointer-events:none}

/* 카톡 공유 */
.share{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;border-radius:999px;
  background:#fee500;color:#191919;font-size:12px;font-weight:600;white-space:nowrap}
.share.mt{margin-top:12px}
.card-h h2 small{font-size:13px;font-weight:500;color:var(--dim);margin-left:6px}
.st{display:flex;gap:10px;margin-top:3px;font-size:12px;color:var(--dim);font-weight:400}
.st b{font-weight:600;color:var(--ok)}
.st .ps{color:#5b63c9;font-weight:600}
.hint{font-size:12px;color:var(--dim);margin:10px 2px 0}

/* 영상 */
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#111}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%}
.vtitle{margin:12px 0 4px;font-size:15px;font-weight:600}
.vmeta{font-size:13px;color:var(--dim)}
.vform{display:flex;flex-direction:column;gap:10px}
.shelf{margin-top:22px}
.shelf-h{display:flex;align-items:baseline;gap:6px;margin-bottom:10px}
.shelf-h b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.shelf-h small{font-size:12px;color:var(--dim)}
.shelf-h .st2{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
.shelf-h .st2.all{color:var(--ok)}
.shelf-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vcard{display:flex;flex-direction:column;align-items:stretch;text-align:left;min-width:0}
.vthumb{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#ddd}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vcard.cur .vthumb{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.vthumb .no{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.vthumb .ck{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center}
.vthumb .ck svg{width:12px;height:12px}
.vcard .vt{margin-top:7px;font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard .by{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .who{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.vcard .who span{display:flex;align-items:center;gap:3px}
.vcard .who img{width:14px;height:14px}
.vcard .who .none{color:#cfcfcf}
.vrow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.wbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--sub)}
.wbtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.vempty{border-radius:16px;background:linear-gradient(160deg,#fff0de,#ffe2c4);padding:20px 18px;margin-bottom:12px;
  display:flex;align-items:center;gap:14px}
.vempty img{width:56px;height:56px;flex:none}
.vempty b{font-size:18px;letter-spacing:-.02em}
.vempty p{margin:4px 0 0;font-size:13px;color:#8a6a4e;line-height:1.5}

/* 축하·토스트 */
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.burst i{position:absolute;top:-20px;font-style:normal;font-size:22px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
</style>
</head>
<body>

<div class="wrap">

  <!-- 캐릭터 고르기 -->
  <section id="v-login" class="pick hidden">
    <div>
      <span class="logo lg" id="logo-lg"></span>
      <p>매일 스픽, 한 주에 자막 없이 영상 3편.<br>누구로 들어갈까요?</p>
    </div>
    <div class="who" id="who"></div>
    <div class="err" id="login-err"></div>
  </section>

  <!-- 대시보드 -->
  <section id="v-main" class="hidden">
    <div class="top">
      <span class="logo" id="logo-sm"></span>
      <button class="me" id="me" title="다른 사람으로 들어가기"></button>
    </div>

    <div class="dash">
      <div class="a-hello hello" id="hello"></div>

      <div class="a-cal card">
        <div class="cal-h">
          <b id="month"></b>
          <div class="nav"><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="cal-foot" id="cal-foot"></div>
      </div>

      <div class="a-todo card" id="todo"></div>
      <div class="a-crew card" id="crew"></div>
      <div class="a-video card" id="video"></div>
    </div>
  </section>
</div>
<div class="burst" id="burst"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ── 백엔드 연결 (미지의 서재와 같은 Supabase, eng_* 테이블) ──
   두 줄을 비우면 이 브라우저 localStorage 로만 동작(혼자 테스트용). */
var SB_URL = 'https://kkkmsnyiwliovitsmsmw.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtra21zbnlpd2xpb3ZpdHNtc213Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTgzNDEsImV4cCI6MjA5NDczNDM0MX0.lNYzLXqyI2cVsxm2yhKgvnIIZpqeIV4TEw-S0gAVb5I';   /* anon public */
var sb = null;
try{ if(SB_URL && SB_KEY && window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){ sb = null; }

/* 스터디 시작일 — 이 날 전은 달력에서 비활성 */
var START = '2026-11-16';

/* 우리 셋. id 는 DB eng_member.phone4 칸에 들어가는 고정값(4자리 형식 유지)
   emoji 는 assets/emoji/ 안 파일 이름. color 는 달력 물감 색 */
var PEOPLE = [
  {phone4:'0001', name:'Simon', color:'#5b9cf5', emoji:'robot',    ch:'🤖'},
  {phone4:'0002', name:'MiMi',  color:'#ff7fa0', emoji:'whale',    ch:'🐳'},
  {phone4:'0003', name:'Jamie', color:'#ffc23d', emoji:'hedgehog', ch:'🦔'}
];
var PASS_PER_WEEK = 1;   /* 사람마다 한 주(월~일)에 쓸 수 있는 패스권 수 */
var SITE = location.origin + location.pathname;
var WD = ['일','월','화','수','목','금','토'];
var WD_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
/* 한 주(월~일)에 볼 영상. from 이후 주부터 그 목록을 씀 — 바꿀 땐 아래에 새 묶음을 추가 */
var VIDEO_SETS = [
  {from:'2026-11-16', list:[
    {vid:'aDblEBU41nA', title:'Why is pepper such a popular spice?', by:'TED-Ed'},
    {vid:'bw5tzcoEG88', title:'How to effectively use visuals in your presentation', by:'TED-Ed'},
    {vid:'nBVuemyrMgE', title:'Is salt the most important ingredient in history?', by:'TED-Ed'}
  ]},
  {from:'2026-11-23', list:[
    {vid:'h-NZcQF7jgI', title:'Learning from different generations', by:'BBC 6 Minute English'},
    {vid:'CelIpn03m1w', title:'Why gold is so valuable', by:'BBC 6 Minute English'},
    {vid:'9ZdPuQtQyUU', title:'Is this the end of British drinking culture?', by:'BBC 6 Minute English'}
  ]}
];
var REACTS = [{k:'cheer', e:'👏', t:'박수'}, {k:'laugh', e:'😂', t:'웃음'}, {k:'love', e:'❤️', t:'하트'}];
function react(k){ return REACTS.find(function(r){ return r.k === k; }) || {k:k, e:'👉', t:'콕'}; }

/* ── 저장소: Supabase 또는 localStorage ── */
var DB = {
  _ls: function(k, v){
    try{
      if(v === undefined) return JSON.parse(localStorage.getItem('eng:'+k) || 'null');
      localStorage.setItem('eng:'+k, JSON.stringify(v));
    }catch(e){ return null; }
  },
  ensureMember: async function(m){
    if(!sb) return;
    var r = await sb.from('eng_member').upsert({phone4:m.phone4, name:m.name, color:m.color}, {onConflict:'phone4', ignoreDuplicates:true});
    if(r.error) throw r.error;
  },
  checks: async function(from, to){
    if(!sb) return (DB._ls('checks') || []).filter(function(c){ return c.day >= from && c.day <= to; });
    var r = await sb.from('eng_check').select('day,phone4,speak,video,pass').gte('day', from).lte('day', to);
    if(r.error) throw r.error; return r.data;
  },
  saveCheck: async function(c){
    if(!sb){
      var a = (DB._ls('checks') || []).filter(function(x){ return !(x.day === c.day && x.phone4 === c.phone4); });
      a.push(c); DB._ls('checks', a); return;
    }
    var r = await sb.from('eng_check').upsert(Object.assign({updated_at: new Date().toISOString()}, c), {onConflict:'day,phone4'});
    if(r.error) throw r.error;
  },
  watches: async function(from, to){
    if(!sb) return (DB._ls('watches') || []).filter(function(w){ return w.week >= from && w.week <= to; });
    var r = await sb.from('eng_watch').select('week,phone4,vid,created_at').gte('week', from).lte('week', to);
    if(r.error) throw r.error; return r.data;
  },
  setWatch: async function(w, on){
    if(!sb){
      var a = (DB._ls('watches') || []).filter(function(x){ return !(x.week === w.week && x.phone4 === w.phone4 && x.vid === w.vid); });
      if(on) a.push(Object.assign({created_at:new Date().toISOString()}, w)); DB._ls('watches', a); return;
    }
    var r = on ? await sb.from('eng_watch').upsert(w, {onConflict:'week,phone4,vid', ignoreDuplicates:true})
               : await sb.from('eng_watch').delete().eq('week', w.week).eq('phone4', w.phone4).eq('vid', w.vid);
    if(r.error) throw r.error;
  },
  cheers: async function(from, to){
    if(!sb) return (DB._ls('cheers') || []).filter(function(c){ return c.day >= from && c.day <= to; });
    var r = await sb.from('eng_cheer').select('day,from_phone4,to_phone4,kind,created_at').gte('day', from).lte('day', to);
    if(r.error) throw r.error; return r.data;
  },
  unCheer: async function(c){
    if(!sb){
      DB._ls('cheers', (DB._ls('cheers') || []).filter(function(x){ return !(x.day === c.day && x.from_phone4 === c.from_phone4 && x.to_phone4 === c.to_phone4 && x.kind === c.kind); }));
      return;
    }
    var r = await sb.from('eng_cheer').delete().eq('day', c.day).eq('from_phone4', c.from_phone4).eq('to_phone4', c.to_phone4).eq('kind', c.kind).select('kind');
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('not deleted');
  },
  sendCheer: async function(c){
    if(!sb){
      var a = DB._ls('cheers') || [];
      if(!a.some(function(x){ return x.day === c.day && x.from_phone4 === c.from_phone4 && x.to_phone4 === c.to_phone4 && x.kind === c.kind; })) a.push(c);
      DB._ls('cheers', a); return;
    }
    var r = await sb.from('eng_cheer').upsert({day:c.day, from_phone4:c.from_phone4, to_phone4:c.to_phone4, kind:c.kind},
      {onConflict:'day,from_phone4,to_phone4,kind', ignoreDuplicates:true});
    if(r.error) throw r.error;
  }
};

/* ── 상태 ── */
var S = { me:null, members:PEOPLE, checks:{}, watch:{}, cheers:[], view:null, sel:null, bloom:null, play:null };

/* ── 날짜 (기기 현지 시각 기준) ── */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function today(){ return ymd(new Date()); }
function label(s){ var d = parse(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; }
function dayNo(s){ return Math.round((parse(s) - parse(START)) / 864e5) + 1; }
function active(s){ return s >= START && s <= today(); }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function show(id){ ['v-login','v-main'].forEach(function(v){ $(v).classList.toggle('hidden', v !== id); }); }
var _tt; function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(function(){ e.classList.remove('show'); }, 1800); }
function emo(name, alt){ return '<img src="assets/emoji/'+name+'.png" alt="'+esc(alt || '')+'" loading="lazy">'; }
function tint(hex){ return hex + '26'; }   // 15% 정도 옅은 배경
function av(m){ return '<span class="av" style="background:'+tint(m.color)+'">'+emo(m.emoji, m.name)+'</span>'; }
var CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

/* ── 로고: 말풍선 + 미지의 영어 ── */
function logoHtml(size){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg'+size+'" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#f9bd85"/><stop offset="1" stop-color="#f28c3c"/></linearGradient></defs>'
    + '<path d="M14 6h36a10 10 0 0 1 10 10v24a10 10 0 0 1-10 10H30l-12 9v-9h-4A10 10 0 0 1 4 40V16A10 10 0 0 1 14 6z" fill="url(#lg'+size+')"/>'
    + '<text x="32" y="37" text-anchor="middle" font-family="Pretendard,sans-serif" font-weight="800" font-size="22" fill="#fff">Aa</text></svg>'
    + '<span class="w">미지의 <em>영어</em></span>';
}

/* ── 달력 타일: 칸을 세 사람 몫으로 나눠, 끝낸 사람은 자기 색 / 하나만 했으면 옅은 색 / 안 했으면 회색.
   패스권 쓴 사람은 자기 색 줄무늬(완료로 침). 셋 다 끝내면 세 색이 부드럽게 섞인 그라데이션 + ✓ ── */
var TILE_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
var GRAY = '#e9e9e7';
function tileHtml(s){
  var n = S.members.length, pop = S.bloom && S.bloom.day === s ? ' pop' : '';
  if(allDone(s)){
    return '<span class="tile full'+pop+'" style="background:linear-gradient(135deg,'
      + S.members.map(function(m){ return chk(s, m.phone4).pass ? m.color + 'aa' : m.color; }).join(',')+')">'+TILE_CHECK+'</span>';
  }
  var any = false, stops = [];
  S.members.forEach(function(m, i){
    var c = chk(s, m.phone4), k = c.pass || c.speak;
    if(k) any = true;
    var col = c.pass ? m.color + 'aa' : k ? m.color : GRAY;
    var a = (i / n * 100).toFixed(1), b = ((i + 1) / n * 100).toFixed(1);
    stops.push(col+' '+a+'%', col+' '+b+'%');
  });
  if(!any) return '<span class="tile"></span>';
  return '<span class="tile'+pop+'" style="background:linear-gradient(135deg,'+stops.join(',')+')"></span>';
}

/* ── 완료 판정 ── */
function chk(day, p){ return (S.checks[day] && S.checks[day][p]) || {speak:false, video:false, pass:false}; }
function personDone(day, p){ var c = chk(day, p); return c.pass || c.speak; }

/* 영상: 그 주(월~일)에 볼 목록과 본 수 */
function weekVids(s){
  var we = addDays(weekStart(s), 6), set = null;
  VIDEO_SETS.forEach(function(x){ if(x.from <= we) set = x; });
  return set ? set.list : [];
}
function watched(s, p, vid){ var a = S.watch[weekStart(s)+'|'+p]; return !!a && a.indexOf(vid) >= 0; }
function watchedCount(s, p){ return weekVids(s).filter(function(v){ return watched(s, p, v.vid); }).length; }
/* 영상 체크한 날(체크 시각 기준) · 그날 본 영상 수 */
function watchedOn(s, p, vid){ return (S.watchAt || {})[weekStart(s)+'|'+p+'|'+vid] || null; }
function md(s){ var d = parse(s); return (d.getMonth()+1)+'/'+d.getDate(); }
/* 고른 날이 속한 주 이름: 이번 주 · 지난 주 · 11/9~15 */
function weekName(s){
  var ws = weekStart(s), cur = weekStart(today());
  if(ws === cur) return '이번 주';
  if(ws === addDays(cur, -7)) return '지난 주';
  return md(ws)+'~'+parse(addDays(ws, 6)).getDate();
}
function thumb(vid){ return 'https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg'; }

/* 패스권: 그 주(월~일)에 이 날 말고 몇 장 썼는지 */
function weekStart(s){ var d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); }
function passLeft(s, p){
  var ws = weekStart(s), n = 0;
  for(var i = 0; i < 7; i++){ var d = addDays(ws, i); if(d !== s && chk(d, p).pass) n++; }
  return Math.max(0, PASS_PER_WEEK - n);
}

/* 응원·콕 */
function sentCheer(day, from, to, kind){
  return S.cheers.some(function(c){ return c.day === day && c.from_phone4 === from && c.to_phone4 === to && c.kind === kind; });
}
function gotCount(day, to, kind){
  return S.cheers.filter(function(c){ return c.day === day && c.to_phone4 === to && c.kind === kind; }).length;
}
function seenKey(){ return 'eng:seen:' + S.me.phone4; }
function newCheers(){
  var seen = ''; try{ seen = localStorage.getItem(seenKey()) || ''; }catch(e){}
  var t = today();
  return S.cheers.filter(function(c){ return c.kind !== 'poke' && c.day === t && c.to_phone4 === S.me.phone4 && (c.created_at || '') > seen; })
    .sort(function(a, b){ return (a.created_at || '') < (b.created_at || '') ? -1 : 1; });
}
function allDone(day){ return S.members.every(function(m){ return personDone(day, m.phone4); }); }

/* ── 데이터 로드 ── */
async function loadAll(){
  var from = addDays(ymd(new Date(S.view.y, S.view.m, 1)), -7);
  if(from < START) from = START;
  var to = addDays(ymd(new Date(S.view.y, S.view.m+1, 0)), 7);
  var res = await Promise.all([DB.checks(from, to), DB.watches(weekStart(START), addDays(today(), 7)), DB.cheers(from, to).catch(function(){ return []; })]);
  S.checks = {};
  res[0].forEach(function(c){ (S.checks[c.day] = S.checks[c.day] || {})[c.phone4] = {speak:!!c.speak, video:!!c.video, pass:!!c.pass}; });
  S.cheers = res[2] || [];
  S.watch = {}; S.watchAt = {};
  res[1].forEach(function(w){
    var k = w.week+'|'+w.phone4; (S.watch[k] = S.watch[k] || []).push(w.vid);
    if(w.created_at) S.watchAt[k+'|'+w.vid] = ymd(new Date(w.created_at));
  });
}

    var n = new Date(); S.sel = today(); S.view = {y:n.getFullYear(), m:n.getMonth()};
  }
  S.today = today();
  try{ await loadAll(); }catch(e){ toast('불러오기 실패 — 새로고침 해 주세요'); }

function render(){

function renderCal(){
  var y = S.view.y, m = S.view.m, t = today();
  $('month').textContent = MON_EN[m]+', '+y;
  var first = new Date(y, m, 1).getDay(), last = new Date(y, m+1, 0).getDate();
  var h = WD.map(function(w){ return '<div class="wd">'+w+'</div>'; }).join('');
  for(var i = 0; i < first; i++) h += '<span class="day out"></span>';

  for(var d = 1; d <= last; d++){

    if(full) fullDays++;
    var cls = 'day' + (full ? ' full' : '') + (s === t ? ' today' : '') + (on && s === S.sel ? ' sel' : '') + (on ? '' : ' off');
    h += '<button class="'+cls+'" data-d="'+s+'"'+(on ? '' : ' disabled')+' aria-label="'+label(s)+'">'

  $('grid').innerHTML = h;
  S.bloom = null;
  $('cal-foot').innerHTML = '<span>'+(fullDays ? '<b>'+fullDays+'일</b> 셋 다 완료' : '셋 다 하면 세 색이 섞여요')+'</span>'

  var now = new Date(), st = parse(START);
  $('next').disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());

function renderDay(){

function passHtml(s, c, on){
  if(!on) return '';
  if(c.pass) return '<button class="passpill" id="pass">🎫 패스 취소</button>';
  if(c.speak) return '';
  var left = passLeft(s, S.me.phone4);
  return left ? '<button class="passpill" id="pass" title="이번 주 '+left+'장 남음">🎫 패스권 쓰기</button>'
              : '<button class="passpill" disabled title="한 주에 '+PASS_PER_WEEK+'장">🎫 이번 주 다 씀</button>';

/* 리액션 3종: 오늘은 누를 수 있고(한 번씩), 지난 날은 받은 것만 보여 줌 */

function videoWeeks(){

function shelfHtml(w, cur){

  return '<div class="shelf"><div class="shelf-h"><b>'+nm+'</b>'+(nm === range ? '' : '<small>'+range+'</small>')+st+'</div>'
    + '<div class="shelf-row">' + list.map(function(v, i){
      var who = S.members.map(function(mm){
        var d = watchedOn(ws, mm.phone4, v.vid);
        return d ? '<span>'+emo(mm.emoji, mm.name)+md(d)+'</span>' : '';
      }).join('');
      return '<button class="vcard'+(cur && v.vid === cur.vid && ws === cur.ws ? ' cur' : '')+'" data-play="'+v.vid+'" data-wk="'+ws+'">'
        + '<span class="vthumb"><img src="'+thumb(v.vid)+'" alt="" loading="lazy"><span class="no">'+(i + 1)+'</span>'
        + (watched(ws, me, v.vid) ? '<span class="ck">'+CHECK_SVG+'</span>' : '')+'</span>'
        + '<b class="vt">'+esc(v.title)+'</b><span class="by">'+esc(v.by)+'</span>'
        + '<span class="who">'+(who || '<span class="none">아직 아무도</span>')+'</span></button>';
    }).join('') + '</div></div>';
}
function renderVideo(){
  var p = S.me.phone4, weeks = videoWeeks(), el = $('video');
  if(!weeks.length){
    if(YTP){ try{ YTP.destroy(); }catch(e){} YTP = null; }
    S.vkey = null; el.innerHTML = '<div class="card-h"><h2>Video</h2></div><div class="note">이번 주 영상이 아직 없어요</div>'; return;
  }
  var w = weeks.find(function(x){ return x.ws === S.playWeek; });
  if(!w || !w.list.some(function(v){ return v.vid === S.play; })){
    w = weeks[0];
    var nx = w.list.find(function(v){ return !watched(w.ws, p, v.vid); });
    S.playWeek = w.ws; S.play = (nx || w.list[0]).vid;
  }
  var v = w.list.find(function(x){ return x.vid === S.play; }), idx = w.list.indexOf(v), key = w.ws+'|'+v.vid;
  if(S.vkey !== key || !$('ytp-wrap')){
    var sameVid = S.vkey && S.vkey.split('|')[1] === v.vid && $('ytp-wrap');
    S.vkey = key;
    if(!sameVid){
      if(YTP){ try{ YTP.destroy(); }catch(e){} YTP = null; }
      el.innerHTML = '<div id="v-top"></div><div class="player" id="ytp-wrap"><div id="ytp"></div></div><div id="v-bot"></div><div id="v-shelf"></div>';
      withYT(function(){
        if(S.vkey.split('|')[1] !== v.vid || !document.getElementById('ytp') || YTP) return;
        YTP = new YT.Player('ytp', {
          videoId:v.vid,
          playerVars:{cc_load_policy:0, rel:0, playsinline:1, modestbranding:1, hl:'en'},
          events:{
            onReady:function(e){ captionsOff(e.target); },
            onStateChange:function(e){ if(e.data === 1) captionsOff(e.target); }
          }
        });
      });
    }
  }
  var seen = watched(w.ws, p, v.vid);
  $('v-top').innerHTML = '<div class="card-h"><h2>Video<small>자막 없이 · 주 '+w.list.length+'편</small></h2></div>';
  $('v-bot').innerHTML = '<div class="vtitle">'+weekName(w.ws)+' '+(idx + 1)+'. '+esc(v.title)+'</div>'
    + '<div class="vmeta">'+esc(v.by)+' · 자막은 꺼진 채로 시작해요</div>'
    + '<div class="vrow"><button class="wbtn'+(seen ? ' on' : '')+'" data-w="'+v.vid+'" data-wk="'+w.ws+'">'+(seen ? '✓ 봤어요' : '다 봤으면 체크')+'</button>'
    + '<button class="share" id="share-video">💬 영상 공유</button></div>';
  $('v-shelf').innerHTML = weeks.map(function(x){ return shelfHtml(x, {ws:w.ws, vid:v.vid}); }).join('');
}
async function toggleWatch(vid, ws){
  var p = S.me.phone4, s = ws;
  var k = ws+'|'+p, on = !watched(s, p, vid);
  function apply(v){
    var a = (S.watch[k] || []).filter(function(x){ return x !== vid; });
    if(v) a.push(vid); S.watch[k] = a;
    S.watchAt = S.watchAt || {};
    if(v) S.watchAt[k+'|'+vid] = today(); else delete S.watchAt[k+'|'+vid];
    renderVideo();
  }
  apply(on);
  try{ await DB.setWatch({week:ws, phone4:p, vid:vid}, on); }
  catch(e){ apply(!on); toast('저장이 안 됐어요. 다시 눌러 주세요'); return; }
  if(!on) return;
  var n = watchedCount(s, p), t = weekVids(s).length;
  toast(n >= t ? weekName(ws)+' 영상 '+t+'편 끝! 🎬🎉' : weekName(ws)+' 영상 '+n+' / '+t+' 봤어요');
}

/* ── 체크 ── */
function renderChecks(){ renderCal(); renderDay(); }
async function toggle(key){
  var s = S.sel, p = S.me.phone4;
  if(!active(s)) return;
  var before = allDone(s);
  var c = Object.assign({}, chk(s, p)); c[key] = !c[key];
  (S.checks[s] = S.checks[s] || {})[p] = c;
  if(c[key]) S.bloom = {day:s, p:p};
  renderChecks();
  try{ await DB.saveCheck({day:s, phone4:p, speak:c.speak, video:c.video, pass:!!c.pass}); }
  catch(e){
    c[key] = !c[key]; S.checks[s][p] = c; renderChecks(); toast('저장이 안 됐어요. 다시 눌러 주세요'); return;
  }
  if(!before && allDone(s)) celebrate();
  else if(personDone(s, p) && c[key]) toast('오늘 내 몫 끝! 🎉');
}
async function togglePass(){
  var s = S.sel, p = S.me.phone4;
  if(!active(s)) return;
  var before = allDone(s), c = Object.assign({}, chk(s, p));
  if(!c.pass && !passLeft(s, p)){ toast('이번 주 패스권을 이미 썼어요'); return; }
  c.pass = !c.pass;
  (S.checks[s] = S.checks[s] || {})[p] = c;
  if(c.pass) S.bloom = {day:s, p:p};
  renderChecks();
  try{ await DB.saveCheck({day:s, phone4:p, speak:c.speak, video:c.video, pass:c.pass}); }
  catch(e){ c.pass = !c.pass; S.checks[s][p] = c; renderChecks(); toast('저장이 안 됐어요. 다시 눌러 주세요'); return; }
  if(!before && allDone(s)) celebrate();
  else toast(c.pass ? '패스권 사용! 내일 다시 달려요 🎫' : '패스를 취소했어요');
}
/* 리액션: 누르면 보내고, 다시 누르면 취소 */
async function cheer(to, kind){
  var t = today(), me = S.me.phone4, r = react(kind);
  var m = S.members.find(function(x){ return x.phone4 === to; });
  var old = S.cheers.find(function(c){ return c.day === t && c.from_phone4 === me && c.to_phone4 === to && c.kind === kind; });
  if(old){
    S.cheers.splice(S.cheers.indexOf(old), 1); renderDay();
    try{ await DB.unCheer(old); }
    catch(e){ S.cheers.push(old); renderDay(); toast('취소가 안 됐어요. 다시 눌러 주세요'); }
    return;
  }
  var c = {day:t, from_phone4:me, to_phone4:to, kind:kind, created_at:new Date().toISOString()};
  S.cheers.push(c); renderDay();
  try{ await DB.sendCheer(c); toast(m.name+'에게 '+r.t+' '+r.e+' 보냈어요'); }
  catch(e){ S.cheers.splice(S.cheers.indexOf(c), 1); renderDay(); toast('못 보냈어요. 다시 눌러 주세요'); }
}
function inboxOk(){
  var last = newCheers().map(function(c){ return c.created_at || ''; }).sort().pop();
  try{ if(last) localStorage.setItem(seenKey(), last); }catch(e){}
  renderHello();
}

/* 카톡 공유: 휴대폰은 공유 시트(카카오톡 선택), PC는 복사 */
function shareOut(text){
  var mobile = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if(mobile && navigator.share){ navigator.share({text:text}).catch(function(){}); return; }
  copyText(text);
}
function copyText(text){
  function done(){ toast('복사했어요 · 카톡방에 붙여넣기 해 주세요'); }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); }
  else fallback();
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 안 됐어요'); }
    document.body.removeChild(ta);
  }
}
function statusText(){
  var s = S.sel, n = dayNo(s), vt = weekVids(s).length;
  var lines = ['[미지의 영어] Day '+n+' · '+label(s)];
  S.members.forEach(function(m){
    var c = chk(s, m.phone4);
    lines.push(m.ch+' '+m.name+'  '+(c.pass ? '🎫 패스' : (c.speak ? '✅' : '⬜')+'스픽')+'  🎬 '+watchedCount(s, m.phone4)+'/'+vt);
  });
  if(allDone(s)) lines.push('🎉 오늘 셋 다 해냈어요!');
  lines.push('', '👉 '+SITE);
  return lines.join('\n');
}
function pokeText(to){
  var me = S.me, m = S.members.find(function(x){ return x.phone4 === to; }), c = chk(today(), to), left = [];
  var vl = weekVids(today()).length - watchedCount(today(), to);
  if(!c.speak) left.push('스픽'); if(vl > 0) left.push('이번 주 영상 '+vl+'편');
  return ['📣 '+m.ch+' '+m.name+', 오늘 영어 했어요? (from '+me.ch+' '+me.name+')',
          left.length ? '아직 '+left.join(', ')+' 남았어요! 얼른 해요 🔥' : '', '', '👉 '+SITE]
    .filter(function(x, i){ return i !== 1 || x; }).join('\n');
}
function videoText(){
  var list = weekVids(today()), lines = ['[미지의 영어] 이번 주 영상 '+list.length+'편 🎬 (자막 없이!)', ''];
  list.forEach(function(v, i){ lines.push((i + 1)+'. '+v.title, 'https://youtu.be/'+v.vid); });
  lines.push('', '보고 체크하기 👉 '+SITE);
  return lines.join('\n');
}

function celebrate(){
  var b = $('burst'), em = ['🎉','✨','🧡','⭐','💙','💛'], h = '';
  for(var i = 0; i < 28; i++){
    h += '<i style="left:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*.6)+'s">'+em[i % em.length]+'</i>';
  }
  b.innerHTML = h; setTimeout(function(){ b.innerHTML = ''; }, 3200);
  toast('셋 다 해냈어요! 🎉');
}

/* ── 이벤트 ── */
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t || t.disabled) return;
  if(t.dataset.d){ S.sel = t.dataset.d; renderCal(); renderDay(); renderVideo(); return; }
  if(t.dataset.t){ toggle(t.dataset.t); return; }
  if(t.dataset.w){ toggleWatch(t.dataset.w, t.dataset.wk); return; }
  if(t.dataset.play){
    S.play = t.dataset.play; S.playWeek = t.dataset.wk; renderVideo();
    var pw = $('ytp-wrap'); if(pw && pw.getBoundingClientRect().top < 0) pw.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(t.dataset.who){ pick(t.dataset.who); return; }
  if(t.dataset.cheer){ cheer(t.dataset.cheer, t.dataset.kind); return; }
  if(t.dataset.pokeshare){ shareOut(pokeText(t.dataset.pokeshare)); return; }
  switch(t.id){
    case 'prev': S.view.m--; if(S.view.m < 0){ S.view.m = 11; S.view.y--; } refresh(); break;
    case 'next': S.view.m++; if(S.view.m > 11){ S.view.m = 0; S.view.y++; } refresh(); break;
    case 'go-today': var n = new Date(); S.sel = today();
      if(S.view.y !== n.getFullYear() || S.view.m !== n.getMonth()){ S.view = {y:n.getFullYear(), m:n.getMonth()}; refresh(); }
      else { renderCal(); renderDay(); renderVideo(); }
      break;
    case 'pass': togglePass(); break;
    case 'inbox-ok': inboxOk(); break;
    case 'share-status': shareOut(statusText()); break;
    case 'share-video': shareOut(videoText()); break;
    case 'me': if(confirm('다른 사람으로 들어갈까요?')) logout(); break;
  }
});
/* 새 버전 확인: 아이폰 홈 화면 앱은 열어 둔 화면을 그대로 이어 쓰므로,
   돌아올 때마다 서버의 index.html 과 지금 코드를 비교해 다르면 새로 불러옴 */
var _upd = 0;
async function checkUpdate(){
  if(Date.now() - _upd < 30000) return; _upd = Date.now();
  try{
    var h = await (await fetch(location.pathname + '?u=' + Date.now(), {cache:'no-store'})).text();
    var m = h.match(/<script>([\s\S]*?)<\/script>/), cur = document.querySelector('script:not([src])');
    if(!m || !cur || m[1] === cur.textContent) return;
    var last = 0; try{ last = +sessionStorage.getItem('eng:reloaded') || 0; }catch(e){}
    if(Date.now() - last < 60000) return;   // 캐시 때문에 계속 옛 버전이면 무한 새로고침 막기
    try{ sessionStorage.setItem('eng:reloaded', Date.now()); }catch(e){}
    await fetch(location.pathname, {cache:'reload'}).catch(function(){});   // 브라우저 캐시도 새 버전으로
    location.reload();
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  checkUpdate();
  if(S.me) refresh();
});
window.addEventListener('pageshow', function(){ checkUpdate(); });
setInterval(function(){
  if(document.hidden) return;
  checkUpdate();
  if(!S.me) return;
  var a = document.activeElement; if(a && a.tagName === 'INPUT') return;   // 링크 입력 중엔 건드리지 않기
  refresh();
}, 60000);

/* ── 시작 ── */
(function init(){
  $('logo-lg').innerHTML = logoHtml(46);
  $('logo-sm').innerHTML = logoHtml(28);
  var saved = null; try{ saved = localStorage.getItem('eng:me'); }catch(e){}
  var m = PEOPLE.find(function(x){ return x.phone4 === saved; });
  if(m){ enter(m); return; }
  renderWho(); show('v-login');
})();
</script>
