<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>미지의 영어</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="미지의 영어">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 흑백 + 포인트 색 하나. 색은 세 사람 색만(달력 칸·막대), UI 는 검은 선과 주황 하나 */
:root{
  --ink:#000; --sub:#777; --dim:#b5b5b5; --soft:#f4f4f4; --bg:#fff; --pt:#ff3d00;
  --sans:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:var(--sans);   /* 글꼴은 Pretendard 하나로 통일 */
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  letter-spacing:-.01em;word-break:keep-all;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
img{display:block}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:20px 20px 48px}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}

/* 로고 */
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.03em}
.logo svg{flex:none}
.logo .w{font-size:16px}
.logo .w em{font-style:normal;color:var(--pt)}
.logo.lg{gap:12px}
.logo.lg .w{font-size:28px}

/* 캐릭터 고르기 */
.pick{min-height:88vh;display:flex;flex-direction:column;justify-content:center;gap:28px}
.pick p{margin:12px 0 0;color:var(--sub);font-size:15px;line-height:1.55}
.who{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink)}
.who button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 8px 16px;border-right:1px solid var(--ink)}
.who button:last-child{border-right:0}
.who button:active{background:var(--soft)}
.who .pic{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.who .pic img{width:48px;height:48px}
.who b{font-size:15px;font-weight:600}
.err{color:var(--pt);font-size:14px;min-height:20px}

/* 아바타(3D 이모지) */
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.av img{width:24px;height:24px}

/* 맨 위 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.me{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;border:1px solid var(--ink);padding:3px 11px 3px 3px;border-radius:999px}
.me .av{width:24px;height:24px}
.me .av img{width:17px;height:17px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.hd .hi{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1.25}
.streak{text-align:right;flex:none}
.streak b{display:block;font-size:52px;font-weight:800;line-height:.9;letter-spacing:-.04em}
.streak small{font-family:var(--mono);font-size:11px;color:var(--sub)}
.inbox{border:1px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.inbox div{font-size:14px;display:flex;align-items:center;gap:8px}
.inbox div img{width:20px;height:20px}
.inbox button{align-self:flex-end;font-family:var(--mono);font-size:11px;color:var(--pt);margin-top:2px}

/* 구역 */
.sec{border-top:2px solid var(--ink);padding:14px 0 20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:26px}
.sec-h b{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.sec-h span{font-family:var(--mono);font-size:11px;color:var(--sub)}
.note{font-size:13px;color:var(--sub);background:var(--soft);padding:14px;text-align:center}

/* 달력: 원래 타일 모양(둥근 네모, 세 사람 몫으로 나눠 칠함) */
.nav{display:flex;gap:6px}
.nav button{width:26px;height:26px;border:1px solid var(--ink);font-size:14px;display:flex;align-items:center;justify-content:center}
.nav button:disabled{visibility:hidden}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px 0;justify-items:center}
.wd{font-family:var(--mono);font-size:10px;color:var(--sub)}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.tile{width:32px;height:32px;border-radius:10px;background:#e9e9e7;display:flex;align-items:center;justify-content:center;transition:background .2s}
.tile svg{width:16px;height:16px}
.tile.full{box-shadow:0 3px 8px rgba(0,0,0,.08)}
.day .n{font-family:var(--mono);font-size:10px;font-weight:500;line-height:1;padding:2px 4px}
.day.today .n{background:var(--pt);color:#fff}
.day.off{cursor:default}
.day.off .tile{background:#f3f3f1}
.day.off .n{color:var(--dim)}
.day.out{visibility:hidden}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.cal-foot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--sub)}
.cal-foot b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:10px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}

/* 오늘: 세 사람 현황 + 체크박스 */
.faces{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-bottom:10px}
.face{display:flex;align-items:center;gap:8px;padding:10px 8px;border-right:1px solid var(--ink);text-align:left;min-width:0}
.face:last-child{border-right:0}
.face .av{width:32px;height:32px}
.face .av img{width:22px;height:22px}
.face .nm{display:flex;flex-direction:column;font-size:13px;font-weight:600;line-height:1.2;min-width:0}
.face small{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--dim);margin-top:2px}
.face:not(.on) .av img{filter:grayscale(1);opacity:.45}
.face.on small{color:var(--pt);font-weight:600}
.ckrow{display:flex;align-items:center;gap:12px;width:100%;height:58px;padding:0 14px;border:2px solid var(--ink);font-size:16px;font-weight:600;text-align:left}
.ckrow:disabled{opacity:.35;cursor:default}
.box{width:26px;height:26px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.box svg{width:16px;height:16px;opacity:0}
.done>.box,.on>.box,.ckb.on{background:var(--pt);border-color:var(--pt)}
.done>.box svg,.ckb.on svg{opacity:1}
.ckrow.done span:last-child{color:var(--dim);text-decoration:line-through}
.under{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--sub);min-height:26px}
.passpill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border:1px solid var(--ink);font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.passpill:disabled{border-color:var(--dim);color:var(--dim)}
.passon{border:2px solid var(--ink);padding:14px;font-size:14px;font-weight:600;text-align:center}
.passon small{display:block;font-weight:400;color:var(--sub);margin-top:4px;font-size:12px}
.allclear{margin-top:12px;padding:10px 12px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;text-align:center}

/* 영상: 한 줄 */
.vchip{display:flex;align-items:center;gap:10px;width:100%;padding:16px 14px;border:2px solid var(--ink);font-size:15px;font-weight:600;text-align:left}
.vchip small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--sub)}
.bars{display:flex;gap:4px;margin-left:auto}
.bars span{display:flex;gap:1px}
.bars i{width:5px;height:14px;display:block;background:#e4e4e4}
.vchip .go{font-family:var(--mono)}

/* 카톡 공유·리액션 */
.share{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;background:#fee500;color:#191919;font-size:12px;font-weight:600;white-space:nowrap}
.reacts{display:flex;gap:5px;flex-wrap:wrap}
.rx{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 9px;border:1px solid #d2d2d2;font-size:14px;line-height:1}
.rx small{font-family:var(--mono);font-size:11px;color:var(--sub)}
.rx.on{border-color:var(--ink);background:var(--soft)}
span.rx{cursor:default}

/* 아래에서 올라오는 창 */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-p{position:relative;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:#fff;border-top:3px solid var(--ink);
  padding:16px 20px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:600px){ .sheet{align-items:center} .sheet-p{border:3px solid var(--ink)} }
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-h b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.sheet-h small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--sub);margin-left:8px}
.sheet-x{width:30px;height:30px;border:1px solid var(--ink);font-size:13px;flex:none}
.prow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--ink);flex-wrap:wrap}
.prow .who2{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-size:15px;font-weight:600}
.prow .who2 small{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--sub);margin-left:4px}
.prow .st{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase}
.prow .st.on{color:var(--pt);font-weight:600}
.prow .reacts{width:100%;padding-left:46px}
.prow.off .av img{filter:grayscale(1);opacity:.45}
.mine{border-top:1px solid var(--ink);padding-top:14px}
.sheet-f{display:flex;justify-content:flex-end;margin-top:14px}

/* 영상 창 */
.player{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#111}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%}
.vtitle{margin:10px 0 2px;font-size:15px;font-weight:600}
.vmeta{font-family:var(--mono);font-size:11px;color:var(--sub);margin-bottom:8px}
.vitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ink)}
.vth{width:104px;aspect-ratio:16/9;overflow:hidden;flex:none;position:relative;background:#111}
.vth img{width:100%;height:100%;object-fit:cover}
.vth span{position:absolute;left:0;top:0;background:#000;color:#fff;font-family:var(--mono);font-size:10px;padding:1px 6px}
.vth.cur{outline:3px solid var(--pt);outline-offset:1px}
.vitem .tx{min-width:0;flex:1}
.vitem .tx b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.when{display:flex;gap:8px;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--ink);flex-wrap:wrap}
.when span{display:flex;align-items:center;gap:3px}
.when img{width:15px;height:15px}
.when .no{color:var(--dim)}
.when .no img{filter:grayscale(1);opacity:.45}
.ckb{width:38px;height:38px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center}
.ckb svg{width:18px;height:18px;opacity:0}
.pastt{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px}
.wkrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--ink);font-size:14px;font-weight:600}
.wkrow small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--sub)}
.wkrow .r{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--sub)}
.wkrow .r.all{color:var(--pt);font-weight:600}

/* 축하·토스트 */
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.burst i{position:absolute;top:-20px;font-style:normal;font-size:22px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="wrap">

  <!-- 캐릭터 고르기 -->
  <section id="v-login" class="pick hidden">
    <div>
      <span class="logo lg" id="logo-lg"></span>
      <p>매일 스픽, 한 주에 자막 없이 영상 3편.<br>누구로 들어갈까요?</p>
    </div>
    <div class="who" id="who"></div>
    <div class="err" id="login-err"></div>
  </section>

  <!-- 대시보드 -->
  <section id="v-main" class="hidden">
    <div class="top">
      <span class="logo" id="logo-sm"></span>
      <button class="me" id="me" title="다른 사람으로 들어가기"></button>
    </div>

    <div id="hello"></div>

    <div class="sec">
      <div class="sec-h">
        <b id="month"></b>
        <div class="nav"><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="cal-foot" id="cal-foot"></div>
    </div>

    <div class="sec" id="todo"></div>
    <div id="video"></div>
  </section>
</div>
<div class="burst" id="burst"></div>
<div class="toast" id="toast"></div>
<div class="sheet hidden" id="sheet"><div class="sheet-bg" id="sheet-bg"></div><div class="sheet-p" id="sheet-p"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ── 백엔드 연결 (미지의 서재와 같은 Supabase, eng_* 테이블) ──
   두 줄을 비우면 이 브라우저 localStorage 로만 동작(혼자 테스트용). */
var SB_URL = 'https://kkkmsnyiwliovitsmsmw.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtra21zbnlpd2xpb3ZpdHNtc213Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTgzNDEsImV4cCI6MjA5NDczNDM0MX0.lNYzLXqyI2cVsxm2yhKgvnIIZpqeIV4TEw-S0gAVb5I';   /* anon public */
var sb = null;
try{ if(SB_URL && SB_KEY && window.supabase) sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){ sb = null; }

/* 스터디 시작일 — 이 날 전은 달력에서 비활성 */
var START = '2026-11-16';

/* 우리 셋. id 는 DB eng_member.phone4 칸에 들어가는 고정값(4자리 형식 유지)
   emoji 는 assets/emoji/ 안 파일 이름. color 는 달력 물감 색 */
var PEOPLE = [
  {phone4:'0001', name:'Simon', color:'#5b9cf5', emoji:'robot',    ch:'🤖'},
  {phone4:'0002', name:'MiMi',  color:'#ff7fa0', emoji:'whale',    ch:'🐳'},
  {phone4:'0003', name:'Jamie', color:'#ffc23d', emoji:'hedgehog', ch:'🦔'}
];
var PASS_PER_WEEK = 1;   /* 사람마다 한 주(월~일)에 쓸 수 있는 패스권 수 */
var SITE = location.origin + location.pathname;
var WD = ['일','월','화','수','목','금','토'];
var MON_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
/* 한 주(월~일)에 볼 영상. from 이후 주부터 그 목록을 씀 — 바꿀 땐 아래에 새 묶음을 추가 */
var VIDEO_SETS = [
  {from:'2026-11-16', list:[
    {vid:'aDblEBU41nA', title:'Why is pepper such a popular spice?', by:'TED-Ed'},
    {vid:'bw5tzcoEG88', title:'How to effectively use visuals in your presentation', by:'TED-Ed'},
    {vid:'nBVuemyrMgE', title:'Is salt the most important ingredient in history?', by:'TED-Ed'}
  ]},
  {from:'2026-11-23', list:[
    {vid:'h-NZcQF7jgI', title:'Learning from different generations', by:'BBC 6 Minute English'},
    {vid:'CelIpn03m1w', title:'Why gold is so valuable', by:'BBC 6 Minute English'},
    {vid:'9ZdPuQtQyUU', title:'Is this the end of British drinking culture?', by:'BBC 6 Minute English'}
  ]}
];
var REACTS = [{k:'cheer', e:'👏', t:'박수'}, {k:'laugh', e:'😂', t:'웃음'}, {k:'love', e:'❤️', t:'하트'}];
function react(k){ return REACTS.find(function(r){ return r.k === k; }) || {k:k, e:'👉', t:'콕'}; }

/* ── 저장소: Supabase 또는 localStorage ── */
var DB = {
  _ls: function(k, v){
    try{
      if(v === undefined) return JSON.parse(localStorage.getItem('eng:'+k) || 'null');
      localStorage.setItem('eng:'+k, JSON.stringify(v));
    }catch(e){ return null; }
  },
  ensureMember: async function(m){
    if(!sb) return;
    var r = await sb.from('eng_member').upsert({phone4:m.phone4, name:m.name, color:m.color}, {onConflict:'phone4', ignoreDuplicates:true});
    if(r.error) throw r.error;
  },
  checks: async function(from, to){
    if(!sb) return (DB._ls('checks') || []).filter(function(c){ return c.day >= from && c.day <= to; });
    var r = await sb.from('eng_check').select('day,phone4,speak,video,pass').gte('day', from).lte('day', to);
    if(r.error) throw r.error; return r.data;
  },
  saveCheck: async function(c){
    if(!sb){
      var a = (DB._ls('checks') || []).filter(function(x){ return !(x.day === c.day && x.phone4 === c.phone4); });
      a.push(c); DB._ls('checks', a); return;
    }
    var r = await sb.from('eng_check').upsert(Object.assign({updated_at: new Date().toISOString()}, c), {onConflict:'day,phone4'});
    if(r.error) throw r.error;
  },
  watches: async function(from, to){
    if(!sb) return (DB._ls('watches') || []).filter(function(w){ return w.week >= from && w.week <= to; });
    var r = await sb.from('eng_watch').select('week,phone4,vid,created_at').gte('week', from).lte('week', to);
    if(r.error) throw r.error; return r.data;
  },
  setWatch: async function(w, on){
    if(!sb){
      var a = (DB._ls('watches') || []).filter(function(x){ return !(x.week === w.week && x.phone4 === w.phone4 && x.vid === w.vid); });
      if(on) a.push(Object.assign({created_at:new Date().toISOString()}, w)); DB._ls('watches', a); return;
    }
    var r = on ? await sb.from('eng_watch').upsert(w, {onConflict:'week,phone4,vid', ignoreDuplicates:true})
               : await sb.from('eng_watch').delete().eq('week', w.week).eq('phone4', w.phone4).eq('vid', w.vid);
    if(r.error) throw r.error;
  },
  cheers: async function(from, to){
    if(!sb) return (DB._ls('cheers') || []).filter(function(c){ return c.day >= from && c.day <= to; });
    var r = await sb.from('eng_cheer').select('day,from_phone4,to_phone4,kind,created_at').gte('day', from).lte('day', to);
    if(r.error) throw r.error; return r.data;
  },
  unCheer: async function(c){
    if(!sb){
      DB._ls('cheers', (DB._ls('cheers') || []).filter(function(x){ return !(x.day === c.day && x.from_phone4 === c.from_phone4 && x.to_phone4 === c.to_phone4 && x.kind === c.kind); }));
      return;
    }
    var r = await sb.from('eng_cheer').delete().eq('day', c.day).eq('from_phone4', c.from_phone4).eq('to_phone4', c.to_phone4).eq('kind', c.kind).select('kind');
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('not deleted');
  },
  sendCheer: async function(c){
    if(!sb){
      var a = DB._ls('cheers') || [];
      if(!a.some(function(x){ return x.day === c.day && x.from_phone4 === c.from_phone4 && x.to_phone4 === c.to_phone4 && x.kind === c.kind; })) a.push(c);
      DB._ls('cheers', a); return;
    }
    var r = await sb.from('eng_cheer').upsert({day:c.day, from_phone4:c.from_phone4, to_phone4:c.to_phone4, kind:c.kind},
      {onConflict:'day,from_phone4,to_phone4,kind', ignoreDuplicates:true});
    if(r.error) throw r.error;
  }
};

/* ── 상태 ── */
var S = { me:null, members:PEOPLE, checks:{}, watch:{}, watchAt:{}, cheers:[], view:null, bloom:null, sheet:null, vkey:null };

/* ── 날짜 (기기 현지 시각 기준) ── */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ var d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function today(){ return ymd(new Date()); }
function label(s){ var d = parse(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; }
function dayNo(s){ return Math.round((parse(s) - parse(START)) / 864e5) + 1; }
function active(s){ return s >= START && s <= today(); }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function show(id){ ['v-login','v-main'].forEach(function(v){ $(v).classList.toggle('hidden', v !== id); }); }
var _tt; function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(function(){ e.classList.remove('show'); }, 1800); }
function emo(name, alt){ return '<img src="assets/emoji/'+name+'.png" alt="'+esc(alt || '')+'" loading="lazy">'; }
function tint(hex){ return hex + '26'; }   // 15% 정도 옅은 배경
function av(m){ return '<span class="av" style="background:'+tint(m.color)+'">'+emo(m.emoji, m.name)+'</span>'; }
var CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

/* ── 로고: 말풍선 + 미지의 영어 ── */
function logoHtml(size){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" aria-hidden="true">'
    + '<path d="M8 6h48v44H30l-12 9v-9H8z" fill="#000"/>'
    + '<text x="32" y="36" text-anchor="middle" font-family="Pretendard,sans-serif" font-weight="800" font-size="22" fill="#fff">Aa</text></svg>'
    + '<span class="w">미지의 <em>영어</em></span>';
}

/* ── 달력 타일(원래 모양): 칸을 세 사람 몫으로 나눠, 끝낸 사람은 자기 색 / 안 했으면 회색.
   패스권 쓴 사람은 옅은 자기 색(완료로 침). 셋 다 끝내면 세 색이 부드럽게 섞인 그라데이션 + ✓ ── */
var TILE_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
var GRAY = '#e9e9e7';
function tileHtml(s){
  var n = S.members.length, pop = S.bloom && S.bloom.day === s ? ' pop' : '';
  if(allDone(s)){
    return '<span class="tile full'+pop+'" style="background:linear-gradient(135deg,'
      + S.members.map(function(m){ return chk(s, m.phone4).pass ? m.color + 'aa' : m.color; }).join(',')+')">'+TILE_CHECK+'</span>';
  }
  var any = false, stops = [];
  S.members.forEach(function(m, i){
    var c = chk(s, m.phone4), k = c.pass || c.speak;
    if(k) any = true;
    var col = c.pass ? m.color + 'aa' : k ? m.color : GRAY;
    var a = (i / n * 100).toFixed(1), b = ((i + 1) / n * 100).toFixed(1);
    stops.push(col+' '+a+'%', col+' '+b+'%');
  });
  if(!any) return '<span class="tile"></span>';
  return '<span class="tile'+pop+'" style="background:linear-gradient(135deg,'+stops.join(',')+')"></span>';
}

/* ── 완료 판정 ── */
function chk(day, p){ return (S.checks[day] && S.checks[day][p]) || {speak:false, video:false, pass:false}; }
function personDone(day, p){ var c = chk(day, p); return c.pass || c.speak; }

/* 영상: 그 주(월~일)에 볼 목록과 본 수 */
function weekVids(s){
  var we = addDays(weekStart(s), 6), set = null;
  VIDEO_SETS.forEach(function(x){ if(x.from <= we) set = x; });
  return set ? set.list : [];
}
function watched(s, p, vid){ var a = S.watch[weekStart(s)+'|'+p]; return !!a && a.indexOf(vid) >= 0; }
function watchedCount(s, p){ return weekVids(s).filter(function(v){ return watched(s, p, v.vid); }).length; }
/* 영상 체크한 날(체크 시각 기준) · 그날 본 영상 수 */
function watchedOn(s, p, vid){ return (S.watchAt || {})[weekStart(s)+'|'+p+'|'+vid] || null; }
function md(s){ var d = parse(s); return (d.getMonth()+1)+'/'+d.getDate(); }
/* 고른 날이 속한 주 이름: 이번 주 · 지난 주 · 11/9~15 */
function weekName(s){
  var ws = weekStart(s), cur = weekStart(today());
  if(ws === cur) return '이번 주';
  if(ws === addDays(cur, -7)) return '지난 주';
  return md(ws)+'~'+parse(addDays(ws, 6)).getDate();
}
function thumb(vid){ return 'https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg'; }

/* 패스권: 그 주(월~일)에 이 날 말고 몇 장 썼는지 */
function weekStart(s){ var d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); }
function passLeft(s, p){
  var ws = weekStart(s), n = 0;
  for(var i = 0; i < 7; i++){ var d = addDays(ws, i); if(d !== s && chk(d, p).pass) n++; }
  return Math.max(0, PASS_PER_WEEK - n);
}

/* 응원·콕 */
function sentCheer(day, from, to, kind){
  return S.cheers.some(function(c){ return c.day === day && c.from_phone4 === from && c.to_phone4 === to && c.kind === kind; });
}
function gotCount(day, to, kind){
  return S.cheers.filter(function(c){ return c.day === day && c.to_phone4 === to && c.kind === kind; }).length;
}
function seenKey(){ return 'eng:seen:' + S.me.phone4; }
function newCheers(){
  var seen = ''; try{ seen = localStorage.getItem(seenKey()) || ''; }catch(e){}
  var t = today();
  return S.cheers.filter(function(c){ return c.kind !== 'poke' && c.day === t && c.to_phone4 === S.me.phone4 && (c.created_at || '') > seen; })
    .sort(function(a, b){ return (a.created_at || '') < (b.created_at || '') ? -1 : 1; });
}
function allDone(day){ return S.members.every(function(m){ return personDone(day, m.phone4); }); }

/* ── 데이터 로드 ── */
async function loadAll(){
  /* 보고 있는 달 + 최근 100일(연속 일수 계산용) */
  var from = addDays(ymd(new Date(S.view.y, S.view.m, 1)), -7), recent = addDays(today(), -100);
  if(recent < from) from = recent;
  if(from < START) from = START;
  var to = addDays(ymd(new Date(S.view.y, S.view.m+1, 0)), 7);
  if(to < today()) to = today();
  var res = await Promise.all([DB.checks(from, to), DB.watches(weekStart(START), addDays(today(), 7)), DB.cheers(from, to).catch(function(){ return []; })]);
  S.checks = {};
  res[0].forEach(function(c){ (S.checks[c.day] = S.checks[c.day] || {})[c.phone4] = {speak:!!c.speak, video:!!c.video, pass:!!c.pass}; });
  S.cheers = res[2] || [];
  S.watch = {}; S.watchAt = {};
  res[1].forEach(function(w){
    var k = w.week+'|'+w.phone4; (S.watch[k] = S.watch[k] || []).push(w.vid);
    if(w.created_at) S.watchAt[k+'|'+w.vid] = ymd(new Date(w.created_at));
  });
}

}

function renderCal(){
  var y = S.view.y, m = S.view.m, t = today();
  $('month').textContent = MON_EN[m]+' '+y;
  var first = new Date(y, m, 1).getDay(), last = new Date(y, m+1, 0).getDate();
  var h = WD.map(function(w){ return '<div class="wd">'+w+'</div>'; }).join('');
  for(var i = 0; i < first; i++) h += '<span class="day out"></span>';

    if(full) fullDays++;

  var now = new Date(), st = parse(START);
  $('next').disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());
  $('prev').disabled = y < st.getFullYear() || (y === st.getFullYear() && m <= st.getMonth());

function stWord(c){ return c.pass ? '패스' : c.speak ? '끝' : '아직'; }

  if(!weeks.length){ $('video').innerHTML = ''; return; }
  $('video').innerHTML = '<button class="vchip" id="vopen"><span>'+(list.length ? '이번 주 영상' : '영상 기록')+'</span>'
    + (list.length ? '<small>'+watchedCount(ws, S.me.phone4)+' / '+list.length+'</small>'
      + '<span class="bars">'+list.map(function(v){
          return '<span>'+S.members.map(function(m){ return '<i'+(watched(ws, m.phone4, v.vid) ? ' style="background:'+m.color+'"' : '')+'></i>'; }).join('')+'</span>';
        }).join('')+'</span>' : '<span class="bars"></span>')
    + '<span class="go">›</span></button>';
}
function vrows(ws, list){
  var cur = S.sheet.play, me = S.me.phone4;
  return list.map(function(v, i){
    return '<div class="vitem"><button class="vth'+(cur && cur.ws === ws && cur.vid === v.vid ? ' cur' : '')+'" data-play="'+v.vid+'" data-wk="'+ws+'" aria-label="'+(i + 1)+'번 영상 재생">'
      + '<img src="'+thumb(v.vid)+'" alt="" loading="lazy"><span>'+(i + 1)+'</span></button>'
      + '<div class="tx"><b>'+esc(v.title)+'</b><div class="when">'+S.members.map(function(m){
          var d = watchedOn(ws, m.phone4, v.vid), w = watched(ws, m.phone4, v.vid);
          return '<span'+(w ? '' : ' class="no"')+'>'+emo(m.emoji, m.name)+(w ? (d ? md(d) : '✓') : '아직')+'</span>';
        }).join('')+'</div></div>'
      + '<button class="ckb'+(watched(ws, me, v.vid) ? ' on' : '')+'" data-w="'+v.vid+'" data-wk="'+ws+'" aria-label="봤어요">'+CHECK_SVG+'</button></div>';
  }).join('');
}
function renderVideoSheet(){
  var o = S.sheet, cw = weekStart(today()), list = weekVids(cw);
  if(!$('s-list')){ killPlayer(); $('sheet-p').innerHTML = '<div id="s-head"></div><div id="s-player"></div><div id="s-list"></div>'; }
  $('s-head').innerHTML = '<div class="sheet-h"><b>'+(list.length ? '이번 주 영상<small>'+weekRange(cw)+' · 자막 없이</small>' : '영상 기록')+'</b>'
    + '<button class="sheet-x" id="sheet-x" aria-label="닫기">✕</button></div>';
  /* 플레이어: 같은 영상이면 그대로 둠(보는 중 끊기지 않게) */
  var pv = o.play && weekVids(o.play.ws).find(function(x){ return x.vid === o.play.vid; }), key = pv ? o.play.ws+'|'+pv.vid : null;
  if(key !== S.vkey){
    killPlayer(); S.vkey = key;
    $('s-player').innerHTML = !pv ? '' : '<div class="player" id="ytp-wrap"><div id="ytp"></div></div>'
      + '<div class="vtitle">'+esc(pv.title)+'</div><div class="vmeta">'+esc(pv.by)+' · 자막은 꺼진 채로 시작해요</div>';
    if(pv) withYT(function(){
      if(S.vkey !== key || !document.getElementById('ytp') || YTP) return;
      YTP = new YT.Player('ytp', {
        videoId:pv.vid,
        playerVars:{cc_load_policy:0, rel:0, playsinline:1, modestbranding:1, hl:'en'},
        events:{
          onReady:function(e){ captionsOff(e.target); },
          onStateChange:function(e){ if(e.data === 1) captionsOff(e.target); }
        }
      });
    });
  }
  var past = videoWeeks().filter(function(w){ return w.ws < cw; });
  $('s-list').innerHTML = vrows(cw, list)
    + (list.length ? '<div class="under"><span>썸네일 = 재생 · 오른쪽 네모 = 봤어요</span><button class="share" id="share-video">💬 영상 공유</button></div>' : '')
    + (past.length ? '<div class="pastt">지난 영상</div>' : '')
    + past.map(function(w){
        var tot = weekTotal(w.ws, w.list), max = w.list.length * S.members.length, open = !!o.open[w.ws];
        return '<button class="wkrow" data-wkopen="'+w.ws+'">'+(open ? '▾' : '▸')+' '+weekRange(w.ws)+' <small>'+esc(w.list[0].by)+'</small>'
          + '<span class="r'+(tot >= max ? ' all' : '')+'">'+(tot >= max ? '셋 다 ✓' : tot+' / '+max)+'</span></button>'
          + (open ? vrows(w.ws, w.list) : '');
      }).join('');
}
async function toggleWatch(vid, ws){
  var p = S.me.phone4, s = ws;
  var k = ws+'|'+p, on = !watched(s, p, vid);
  function apply(v){
    var a = (S.watch[k] || []).filter(function(x){ return x !== vid; });
    if(v) a.push(vid); S.watch[k] = a;
    S.watchAt = S.watchAt || {};
    if(v) S.watchAt[k+'|'+vid] = today(); else delete S.watchAt[k+'|'+vid];
    render();
  }
  apply(on);
  try{ await DB.setWatch({week:ws, phone4:p, vid:vid}, on); }
  catch(e){ apply(!on); toast('저장이 안 됐어요. 다시 눌러 주세요'); return; }
  if(!on) return;
  var n = watchedCount(s, p), t = weekVids(s).length;
  toast(n >= t ? weekName(ws)+' 영상 '+t+'편 끝! 🎬🎉' : weekName(ws)+' 영상 '+n+' / '+t+' 봤어요');
}

/* ── 체크 ── */
function renderChecks(){ render(); }
async function toggle(key, day){
  var s = day || today(), p = S.me.phone4;
  if(!active(s)) return;
  var before = allDone(s);
  var c = Object.assign({}, chk(s, p)); c[key] = !c[key];
  (S.checks[s] = S.checks[s] || {})[p] = c;
  if(c[key]) S.bloom = {day:s, p:p};
  renderChecks();
  try{ await DB.saveCheck({day:s, phone4:p, speak:c.speak, video:c.video, pass:!!c.pass}); }
  catch(e){
    c[key] = !c[key]; S.checks[s][p] = c; renderChecks(); toast('저장이 안 됐어요. 다시 눌러 주세요'); return;
  }
  if(!before && allDone(s)) celebrate();
  else if(personDone(s, p) && c[key]) toast(s === today() ? '오늘 내 몫 끝! 🎉' : '체크했어요');
}
async function togglePass(day){
  var s = day || today(), p = S.me.phone4;
  if(!active(s)) return;
  var before = allDone(s), c = Object.assign({}, chk(s, p));
  if(!c.pass && !passLeft(s, p)){ toast('이번 주 패스권을 이미 썼어요'); return; }
  c.pass = !c.pass;
  (S.checks[s] = S.checks[s] || {})[p] = c;
  if(c.pass) S.bloom = {day:s, p:p};
  renderChecks();
  try{ await DB.saveCheck({day:s, phone4:p, speak:c.speak, video:c.video, pass:c.pass}); }
  catch(e){ c.pass = !c.pass; S.checks[s][p] = c; renderChecks(); toast('저장이 안 됐어요. 다시 눌러 주세요'); return; }
  if(!before && allDone(s)) celebrate();
  else toast(c.pass ? '패스권 사용! 내일 다시 달려요 🎫' : '패스를 취소했어요');
}
/* 리액션: 누르면 보내고, 다시 누르면 취소 */
async function cheer(to, kind){
  var t = today(), me = S.me.phone4, r = react(kind);
  var m = S.members.find(function(x){ return x.phone4 === to; });
  var old = S.cheers.find(function(c){ return c.day === t && c.from_phone4 === me && c.to_phone4 === to && c.kind === kind; });
  if(old){
    S.cheers.splice(S.cheers.indexOf(old), 1); render();
    try{ await DB.unCheer(old); }
    catch(e){ S.cheers.push(old); render(); toast('취소가 안 됐어요. 다시 눌러 주세요'); }
    return;
  }
  var c = {day:t, from_phone4:me, to_phone4:to, kind:kind, created_at:new Date().toISOString()};
  S.cheers.push(c); render();
  try{ await DB.sendCheer(c); toast(m.name+'에게 '+r.t+' '+r.e+' 보냈어요'); }
  catch(e){ S.cheers.splice(S.cheers.indexOf(c), 1); render(); toast('못 보냈어요. 다시 눌러 주세요'); }
}
function inboxOk(){
  var last = newCheers().map(function(c){ return c.created_at || ''; }).sort().pop();
  try{ if(last) localStorage.setItem(seenKey(), last); }catch(e){}
  renderHello();
}

/* 카톡 공유: 휴대폰은 공유 시트(카카오톡 선택), PC는 복사 */
function shareOut(text){
  var mobile = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if(mobile && navigator.share){ navigator.share({text:text}).catch(function(){}); return; }
  copyText(text);
}
function copyText(text){
  function done(){ toast('복사했어요 · 카톡방에 붙여넣기 해 주세요'); }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, fallback); }
  else fallback();
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 안 됐어요'); }
    document.body.removeChild(ta);
  }
}
function statusText(day){
  var s = day || today(), n = dayNo(s), vt = weekVids(s).length;
  var lines = ['[미지의 영어] Day '+n+' · '+label(s)];
  S.members.forEach(function(m){
    var c = chk(s, m.phone4);
    lines.push(m.ch+' '+m.name+'  '+(c.pass ? '🎫 패스' : (c.speak ? '✅' : '⬜')+'스픽')+'  🎬 '+watchedCount(s, m.phone4)+'/'+vt);
  });
  if(allDone(s)) lines.push(s === today() ? '🎉 오늘 셋 다 해냈어요!' : '🎉 셋 다 해냈어요!');
  lines.push('', '👉 '+SITE);
  return lines.join('\n');
}
function pokeText(to){
  var me = S.me, m = S.members.find(function(x){ return x.phone4 === to; }), c = chk(today(), to), left = [];
  var vl = weekVids(today()).length - watchedCount(today(), to);
  if(!c.speak) left.push('스픽'); if(vl > 0) left.push('이번 주 영상 '+vl+'편');
  return ['📣 '+m.ch+' '+m.name+', 오늘 영어 했어요? (from '+me.ch+' '+me.name+')',
          left.length ? '아직 '+left.join(', ')+' 남았어요! 얼른 해요 🔥' : '', '', '👉 '+SITE]
    .filter(function(x, i){ return i !== 1 || x; }).join('\n');
}
function videoText(){
  var list = weekVids(today()), lines = ['[미지의 영어] 이번 주 영상 '+list.length+'편 🎬 (자막 없이!)', ''];
  list.forEach(function(v, i){ lines.push((i + 1)+'. '+v.title, 'https://youtu.be/'+v.vid); });
  lines.push('', '보고 체크하기 👉 '+SITE);
  return lines.join('\n');
}

function celebrate(){
  var b = $('burst'), em = ['🎉','✨','🧡','⭐','💙','💛'], h = '';
  for(var i = 0; i < 28; i++){
    h += '<i style="left:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*.6)+'s">'+em[i % em.length]+'</i>';
  }
  b.innerHTML = h; setTimeout(function(){ b.innerHTML = ''; }, 3200);
  toast('셋 다 해냈어요! 🎉');
}

/* ── 이벤트 ── */
document.addEventListener('click', function(e){
  if(e.target.id === 'sheet-bg'){ closeSheet(); return; }
  var t = e.target.closest('button'); if(!t || t.disabled) return;
  if(t.dataset.d){ openSheet({mode:'day', day:t.dataset.d}); return; }
  if(t.dataset.t){ toggle(t.dataset.t, t.dataset.day); return; }
  if(t.dataset.pass){ togglePass(t.dataset.pass); return; }
  if(t.dataset.w){ toggleWatch(t.dataset.w, t.dataset.wk); return; }
  if(t.dataset.play){ S.sheet.play = {ws:t.dataset.wk, vid:t.dataset.play}; renderSheet(); $('sheet-p').scrollTop = 0; return; }
  if(t.dataset.wkopen){ S.sheet.open[t.dataset.wkopen] = !S.sheet.open[t.dataset.wkopen]; renderSheet(); return; }
  if(t.dataset.who){ pick(t.dataset.who); return; }
  if(t.dataset.cheer){ cheer(t.dataset.cheer, t.dataset.kind); return; }
  if(t.dataset.pokeshare){ shareOut(pokeText(t.dataset.pokeshare)); return; }
  switch(t.id){
    case 'prev': S.view.m--; if(S.view.m < 0){ S.view.m = 11; S.view.y--; } refresh(); break;
    case 'next': S.view.m++; if(S.view.m > 11){ S.view.m = 0; S.view.y++; } refresh(); break;
    case 'inbox-ok': inboxOk(); break;
    case 'vopen': openSheet({mode:'video', play:null, open:{}}); break;
    case 'sheet-x': closeSheet(); break;
    case 'share-status': shareOut(statusText(S.sheet && S.sheet.day)); break;
    case 'share-video': shareOut(videoText()); break;
    case 'me': if(confirm('다른 사람으로 들어갈까요?')) logout(); break;
  }
});
/* 새 버전 확인: 아이폰 홈 화면 앱은 열어 둔 화면을 그대로 이어 쓰므로,
   돌아올 때마다 서버의 index.html 과 지금 코드를 비교해 다르면 새로 불러옴 */
var _upd = 0;
async function checkUpdate(){
  if(Date.now() - _upd < 30000) return; _upd = Date.now();
  try{
    var h = await (await fetch(location.pathname + '?u=' + Date.now(), {cache:'no-store'})).text();
    var m = h.match(/<script>([\s\S]*?)<\/script>/), cur = document.querySelector('script:not([src])');
    if(!m || !cur || m[1] === cur.textContent) return;
    var last = 0; try{ last = +sessionStorage.getItem('eng:reloaded') || 0; }catch(e){}
    if(Date.now() - last < 60000) return;   // 캐시 때문에 계속 옛 버전이면 무한 새로고침 막기
    try{ sessionStorage.setItem('eng:reloaded', Date.now()); }catch(e){}
    await fetch(location.pathname, {cache:'reload'}).catch(function(){});   // 브라우저 캐시도 새 버전으로
    location.reload();
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  checkUpdate();
  if(S.me) refresh();
});
window.addEventListener('pageshow', function(){ checkUpdate(); });
setInterval(function(){
  if(document.hidden) return;
  checkUpdate();
  if(!S.me) return;
  var a = document.activeElement; if(a && a.tagName === 'INPUT') return;   // 링크 입력 중엔 건드리지 않기
  refresh();
}, 60000);

/* ── 시작 ── */
(function init(){
  $('logo-lg').innerHTML = logoHtml(46);
  $('logo-sm').innerHTML = logoHtml(28);
  var saved = null; try{ saved = localStorage.getItem('eng:me'); }catch(e){}
  var m = PEOPLE.find(function(x){ return x.phone4 === saved; });
  if(m){ enter(m); return; }
  renderWho(); show('v-login');
})();
</script>
